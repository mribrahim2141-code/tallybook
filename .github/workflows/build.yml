
name: build

on:
  workflow_dispatch:
  push:
    branches: [ master, feat/arabic-rtl-emerald-glass ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Use the repository-pinned Gradle Wrapper instead of provisioning a
      # separate Gradle distribution through setup-gradle.
      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle', 'gradle/libs.versions.toml') }}

      # Build and run tests
      - name: Build and Run Tests
        run: |
          ./gradlew --no-daemon clean testFlossOsmDebugUnitTest assembleFlossOsmDebug assembleFlossOsmDebugAndroidTest lintFlossOsmDebug

      # Automatically diagnose failed unit tests
      - name: Diagnose Failed Unit Tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          report_path = "app/build/test-results/testFlossOsmDebugUnitTest/**/*.xml"
          files = glob.glob(report_path, recursive=True)

          if not files:
              print("No test XML reports found.")
          else:
              failed_count = 0

              for file in files:
                  try:
                      root = ET.parse(file).getroot()

                      for test in root.iter("testcase"):
                          for error in list(test):
                              if error.tag in ("failure", "error"):
                                  failed_count += 1

                                  print("\n" + "=" * 70)
                                  print("FAILED TEST")
                                  print("=" * 70)
                                  print("Class:", test.get("classname", "Unknown"))
                                  print("Test:", test.get("name", "Unknown"))
                                  print("Type:", error.tag)
                                  print("Message:", error.get("message", "No message"))
                                  print("\nDetails:")
                                  print(error.text or "No additional details")

                      print("\nReport file:", file)

                  except Exception as exc:
                      print("Could not read report:", file)
                      print("Error:", str(exc))

              print("\n" + "=" * 70)
              print("TOTAL FAILED TESTS:", failed_count)
              print("=" * 70)

              if failed_count == 0:
                  print("No failed tests were detected in the XML reports.")
          PY

      # Upload lint report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-flossOsmDebug.html
          if-no-files-found: ignore

      # Upload unit test reports
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testFlossOsmDebugUnitTest/**
            app/build/test-results/testFlossOsmDebugUnitTest/**
          if-no-files-found: ignore

      # Upload debug APK
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debug-apk
          path: app/build/outputs/apk/flossOsm/debug/*.apk
          if-no-files-found: ignore
